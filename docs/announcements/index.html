</div>

<script>

let template = null;
let values = {};
let templateList = [];

/* ======================================================
   Template laden
====================================================== */
async function loadTemplateList() {
    const response = await fetch("templates.json");

    if (!response.ok) {
        throw new Error("templates.json konnte nicht geladen werden");
    }

    const data = await response.json();

    templateList = data.templates;

    const select = document.getElementById("templateSelect");

    select.innerHTML = `
        <option value="">Template auswählen...</option>
    `;

    for (const item of templateList) {
        const option = document.createElement("option");

        option.value = item.file;
        option.textContent = item.name;

        select.appendChild(option);
    }
}


async function loadTemplate(file) {
    if (!file) {
        return;
    }

    const response = await fetch(file);

    if (!response.ok) {
        throw new Error(`Template konnte nicht geladen werden: ${file}`);
    }

    template = await response.json();

    values = {};

    createForm();
    render();
}


/* ======================================================
   Anwendung initialisieren
====================================================== */

function initialise() {

    createForm();
    render();

}


/* ======================================================
   Formular aus JSON erzeugen
====================================================== */

function createForm() {

    const form = document.getElementById("form");

    form.innerHTML = "";

    for (const field of template.fields) {

        values[field.id] =
            field.default ?? "";

        const wrapper = document.createElement("div");

        wrapper.className = "field";

        const label = document.createElement("label");

        label.textContent = field.label;

        wrapper.appendChild(label);


        const input = document.createElement("input");

        input.type = field.type || "text";

        input.value = values[field.id];

        input.placeholder =
            field.placeholder || "";

        input.addEventListener("input", () => {

            values[field.id] = input.value;

            render();

        });

        wrapper.appendChild(input);

        form.appendChild(wrapper);

    }

}


/* ======================================================
   Template rendern
====================================================== */

function render() {

    const canvas =
        document.getElementById("canvas");

    canvas.innerHTML = "";


    /*
     * Hintergrund
     */

    if (template.background) {

        const background =
            document.createElement("img");

        background.src =
            template.background;

        background.className =
            "canvas-background";

        canvas.appendChild(background);

    }


    /*
     * Elemente
     */

    for (const element of template.elements) {

        const node =
            document.createElement("img");

        /*
         * Text-Elemente werden separat behandelt.
         */

        if (element.type === "text") {

            const text =
                document.createElement("div");

            text.className =
                "element text";

            text.textContent =
                resolveValue(element.value);

            applyPosition(
                text,
                element
            );

            applyTextStyle(
                text,
                element
            );

            canvas.appendChild(text);

        }


        /*
         * Bild-Elemente
         */

        else if (element.type === "image") {

            const image =
                document.createElement("img");

            image.className =
                "element logo";

            image.src =
                resolveValue(element.value);

            applyPosition(
                image,
                element
            );

            canvas.appendChild(image);

        }
        /*
         * Pinsel-Text-Elemente
         */
        else if (element.type === "brushText") {

            const wrapper = document.createElement("div");

            wrapper.className = "element brush-text";

            applyPosition(wrapper, element);

            const background = document.createElement("div");

            background.className = "brush-background";

            if (element.brush?.color) {
                background.style.backgroundColor =
                    element.brush.color;
            }

            if (element.brush?.rotation) {
                background.style.transform =
                    `rotate(${element.brush.rotation}deg)`;
            }

            wrapper.appendChild(background);


            const text = document.createElement("div");

            text.className = "brush-label";

            text.textContent =
                resolveValue(element.value);

            applyTextStyle(text, element);

            wrapper.appendChild(text);

            canvas.appendChild(wrapper);
        }
    }

}


/* ======================================================
   {{field}} Werte aus JSON ersetzen
====================================================== */

function resolveValue(value) {

    if (typeof value !== "string") {
        return value;
    }

    return value.replace(
        /\{\{([^}]+)\}\}/g,
        (match, key) => {

            return values[key.trim()] ?? "";

        }
    );

}


/* ======================================================
   Position eines Elements
====================================================== */

function applyPosition(node, element) {

    node.style.left =
        `${element.x}px`;

    node.style.top =
        `${element.y}px`;

    if (element.width) {

        node.style.width =
            `${element.width}px`;

    }

    if (element.height) {

        node.style.height =
            `${element.height}px`;

    }

}


/* ======================================================
   Text-Styling
====================================================== */

function applyTextStyle(node, element) {

    if (element.font) {
        const font = template.fonts?.[element.font] || element.font;
        node.style.fontFamily = `"${font}", sans-serif`;
    }

    if (element.fontSize) {
        node.style.fontSize = `${element.fontSize}px`;
    }

    if (element.fontWeight) {
        node.style.fontWeight = element.fontWeight;
    }

    if (element.letterSpacing) {
        node.style.letterSpacing = `${element.letterSpacing}px`;
    }

    if (element.color) {
        node.style.color = element.color;
    }

    if (element.textAlign) {
        node.style.textAlign = element.textAlign;
    }

    if (element.width) {
        node.style.width = `${element.width}px`;
    }

    if (element.lineHeight) {
        node.style.lineHeight = element.lineHeight;
    }
}

async function init() {
    try {
        await loadTemplateList();
    } catch (error) {
        console.error(error);
        alert("Templates konnten nicht geladen werden.");
    }
}

/* ======================================================
   PNG exportieren
====================================================== */

async function exportPNG() {

    const status =
        document.getElementById("status");

    status.textContent =
        "PNG wird erzeugt...";

    try {

        const canvas =
            document.getElementById("canvas");

        const dataUrl =
            await htmlToImage.toPng(
                canvas,
                {
                    width: template.width,
                    height: template.height,
                    pixelRatio: 1
                }
            );


        /*
         * Download
         */

        const link =
            document.createElement("a");

        link.download =
            "spielankuendigung.png";

        link.href =
            dataUrl;

        link.click();

        status.textContent =
            "PNG wurde erzeugt.";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Fehler beim Erzeugen des PNG.";

    }

}


/* ======================================================
   Export Button
====================================================== */

document
    .getElementById("export")
    .addEventListener(
        "click",
        exportPNG
    );

document
    .getElementById("templateSelect")
    .addEventListener("change", async (event) => {

        const file = event.target.value;

        if (!file) {
            return;
        }

        try {
            await loadTemplate(file);
        } catch (error) {
            console.error(error);
            alert("Template konnte nicht geladen werden.");
        }
    });

/* ======================================================
   Start
====================================================== */

init();

</script>

</body>
